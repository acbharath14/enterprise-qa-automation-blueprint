name: e2e

on:
  push:
    branches: [main]
    paths: ['playwright-suite/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['playwright-suite/**', '.github/workflows/e2e.yml']
  schedule:
    # Weekly Monday 06:00 UTC — keeps the suite (and badge) alive
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-suite
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests (shard ${{ matrix.shard }}/2)
        working-directory: playwright-suite
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-suite/playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: playwright-suite/allure-results/
          retention-days: 14

  publish-report:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-suite
        run: npx playwright install --with-deps chromium

      # Two deliberately wrong assertions. They fail here but the job continues,
      # so the published Allure report shows what a real failure looks like
      # (assertion diff, screenshot, video, trace) without breaking the build.
      - name: Run failure showcase
        working-directory: playwright-suite
        continue-on-error: true
        env:
          CI: true
          SHOWCASE: '1'
        run: |
          npx playwright test tests/failure-showcase.spec.ts --project=chromium --reporter=allure-playwright
          mv allure-results ../showcase-allure-results

      - uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: _site
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: allure-results
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Allure history for trends
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json; do
            curl -sfL "https://acbharath14.github.io/enterprise-qa-automation-blueprint/allure/history/$f" \
              -o "allure-results/history/$f" || echo "no previous $f yet"
          done

      - name: Generate Allure report (suite + showcase merged)
        run: |
          npm install -g allure-commandline
          allure generate allure-results showcase-allure-results -o _site/allure --clean

      - name: Add report index
        run: |
          printf '%s\n' '<!doctype html><html><body><h1>Test Reports</h1><p>The Allure report includes two intentional failures under <b>Showcase › Intentional failures</b>, demonstrating failure capture (assertion diff, screenshot, video, trace).</p><ul><li><a href="allure/">Allure report</a></li><li><a href="playwright-report-shard-1/">Playwright HTML — Shard 1</a></li><li><a href="playwright-report-shard-2/">Playwright HTML — Shard 2</a></li></ul></body></html>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
