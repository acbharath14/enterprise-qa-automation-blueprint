name: e2e

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['playwright-suite/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['playwright-suite/**', '.github/workflows/e2e.yml']
  schedule:
    # Weekly Monday 06:00 UTC — keeps the suite (and badge) alive
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright-suite/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: playwright-suite
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests (shard ${{ matrix.shard }}/2)
        working-directory: playwright-suite
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Summarize failures
        if: always()
        working-directory: playwright-suite
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'allure-results';
          // Deduplicate by testCaseId, keep last (final retry outcome)
          const byTest = new Map();
          if (fs.existsSync(dir)) {
            const files = fs.readdirSync(dir)
              .filter(f => f.endsWith('-result.json'))
              .map(f => ({ f, mtime: fs.statSync(path.join(dir, f)).mtimeMs }))
              .sort((a, b) => a.mtime - b.mtime);
            for (const { f } of files) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              const key = r.testCaseId || r.historyId || (r.fullName + '|' + r.name);
              byTest.set(key, r);
            }
          }
          const failures = [];
          for (const r of byTest.values()) {
            if (r.status === 'failed') {
              const err = (r.statusDetails?.message || 'Unknown error').split('\n')[0].slice(0, 180);
              failures.push({ name: r.name, err: err.replace(/\|/g, '\\\\|') });
            }
          }
          let md = '## Test Failures (shard ${{ matrix.shard }})\n\n';
          if (!failures.length) md += 'No failures.\n';
          else {
            md += '| Test | Error |\n|------|-------|\n';
            for (const f of failures.slice(0, 50)) md += '| ' + f.name + ' | ' + f.err + ' |\n';
            if (failures.length > 50) md += '\n_Showing 50 of ' + failures.length + '._\n';
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "

      - name: Apply friendly Allure suite names
        working-directory: playwright-suite
        run: node scripts/fix-allure-labels.mjs

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-suite/playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: playwright-suite/allure-results/
          retention-days: 14

  quality-gate:
    timeout-minutes: 10
    # Release signal: renders an explicit GO / NO-GO verdict on the run summary.
    # if: always() so the NO-GO decision shows even when tests fail.
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: gate-results
          merge-multiple: true

      - name: Evaluate quality gate
        run: node playwright-suite/scripts/quality-gate.mjs gate-results

  contract:
    # Pact consumer + provider verification (no browsers needed).
    needs: test
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Run Pact contract tests
        working-directory: playwright-suite
        run: npm run test:contract

  publish-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-suite
        run: npx playwright install --with-deps chromium

      # Two deliberately wrong assertions. They fail here but the job continues,
      # so the published reports show what a real failure looks like
      # (assertion diff, screenshot, video, trace) without breaking the build.
      # Note: `|| true` is required — without it, bash -e aborts the step on
      # the failing tests and the `mv` commands below never run.
      - name: Run failure showcase
        working-directory: playwright-suite
        continue-on-error: true
        env:
          CI: true
          SHOWCASE: '1'
        run: |
          npx playwright test tests/failure-showcase.spec.ts --project=chromium --reporter=allure-playwright,html || true
          mv allure-results ../showcase-allure-results
          mv playwright-report ../showcase-playwright-report

      - name: Upload showcase Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-showcase
          path: showcase-allure-results/
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: _site
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          path: allure-results
          merge-multiple: true

      - name: Apply friendly Allure suite names
        run: |
          node playwright-suite/scripts/fix-allure-labels.mjs allure-results
          node playwright-suite/scripts/fix-allure-labels.mjs showcase-allure-results

      - name: Restore previous Allure history
        run: |
          mkdir -p allure-results/history
          curl -sf https://acbharath14.github.io/enterprise-qa-automation-blueprint/allure/history/history.json \
            -o allure-results/history/history.json || echo "No previous history (first run)"

      - name: Generate Allure report (suite + showcase merged)
        run: |
          npm install -g allure-commandline
          allure generate allure-results showcase-allure-results -o _site/allure --clean

      - name: Add showcase HTML report to the site
        run: |
          mkdir -p _site/playwright-report-showcase
          cp -r showcase-playwright-report/* _site/playwright-report-showcase/

      - name: Add report index
        run: |
          printf '%s\n' '<!doctype html><html><body><h1>Test Reports</h1><p>The <b>failure showcase</b> holds two intentional failures, demonstrating failure capture (assertion diff, screenshot, video, trace).</p><ul><li><a href="allure/">Allure report</a> (failures under <b>Showcase › Intentional failures</b>)</li><li><a href="playwright-report-showcase/">Playwright HTML — Failure showcase</a></li><li><a href="playwright-report-shard-1/">Playwright HTML — Shard 1</a></li><li><a href="playwright-report-shard-2/">Playwright HTML — Shard 2</a></li></ul></body></html>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4

  notify:
    timeout-minutes: 10
    # Email execution summary after every main run (push, schedule, manual).
    needs: [test, publish-report]
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: notify-results
          merge-multiple: true

      - name: Build execution summary
        id: summary
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          // Deduplicate: group by testCaseId (stable across retries), keep the LAST result
          // (Allure writes one file per attempt; the final attempt is the true outcome).
          const byTest = new Map();
          const files = fs.readdirSync('notify-results')
            .filter(f => f.endsWith('-result.json'))
            .map(f => ({ f, mtime: fs.statSync(path.join('notify-results', f)).mtimeMs }))
            .sort((a, b) => a.mtime - b.mtime);
          for (const { f } of files) {
            const r = JSON.parse(fs.readFileSync(path.join('notify-results', f), 'utf8'));
            const key = r.testCaseId || r.historyId || (r.fullName + '|' + r.name);
            byTest.set(key, r.status);
          }
          const counts = { passed: 0, failed: 0, skipped: 0, broken: 0 };
          for (const status of byTest.values()) {
            if (counts[status] !== undefined) counts[status]++;
          }
          const total = Object.values(counts).reduce((a, b) => a + b, 0);
          for (const [k, v] of Object.entries({ total, ...counts }))
            fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
          "

      - name: Send email summary
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node -e "
          const https = require('https');
          const summary = {
            total: parseInt('${{ steps.summary.outputs.total }}') || 0,
            passed: parseInt('${{ steps.summary.outputs.passed }}') || 0,
            failed: parseInt('${{ steps.summary.outputs.failed }}') || 0,
            skipped: parseInt('${{ steps.summary.outputs.skipped }}') || 0,
            broken: parseInt('${{ steps.summary.outputs.broken }}') || 0,
          };
          const pct = (n) => summary.total ? (n / summary.total * 100).toFixed(1) : 0;
          const bar = (n, color) => summary.total && n > 0
            ? '<div style=\"height:18px;background:' + color + ';width:' + pct(n) + '%;display:inline-block;\" title=\"' + n + '\"></div>'
            : '';
          const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          const body = {
            from: 'QA Automation <onboarding@resend.dev>',
            to: ['acbharath14@gmail.com'],
            subject: \`E2E summary: \${summary.passed} passed, \${summary.failed} failed, \${summary.skipped} skipped (run #${{ github.run_number }})\`,
            html: \`
              <h2>Playwright E2E — execution summary</h2>
              <p>Repo: ${{ github.repository }} · Branch: main · <a href=\"\${runUrl}\">workflow run #${{ github.run_number }}</a></p>
              <div style=\"width:100%;max-width:500px;background:#eee;border-radius:4px;overflow:hidden;white-space:nowrap;font-size:0;\">\${bar(summary.passed, '#22c55e')}\${bar(summary.failed, '#ef4444')}\${bar(summary.skipped, '#f59e0b')}\${bar(summary.broken, '#a855f7')}</div>
              <ul>
                <li>Total: \${summary.total}</li>
                <li><span style=\"color:#22c55e;\">■</span> Passed: \${summary.passed} (\${pct(summary.passed)}%)</li>
                <li><span style=\"color:#ef4444;\">■</span> Failed: \${summary.failed} (\${pct(summary.failed)}%) — 2 are intentional showcase failures</li>
                <li><span style=\"color:#f59e0b;\">■</span> Skipped: \${summary.skipped} (\${pct(summary.skipped)}%)</li>
                <li><span style=\"color:#a855f7;\">■</span> Broken: \${summary.broken}</li>
              </ul>
              <p><a href=\"https://acbharath14.github.io/enterprise-qa-automation-blueprint/allure/\">Allure report</a> ·
              <a href=\"https://acbharath14.github.io/enterprise-qa-automation-blueprint/playwright-report-showcase/\">Failure showcase (HTML)</a> ·
              <a href=\"https://acbharath14.github.io/enterprise-qa-automation-blueprint/\">All reports</a></p>\`,
          };
          const data = JSON.stringify(body);
          const req = https.request('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.RESEND_API_KEY,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(data),
            },
          }, (res) => {
            let out = '';
            res.on('data', (c) => out += c);
            res.on('end', () => {
              console.log('Resend status:', res.statusCode, out);
              if (res.statusCode >= 300) process.exit(1);
            });
          });
          req.on('error', (e) => { console.error(e); process.exit(1); });
          req.write(data);
          req.end();
          "
