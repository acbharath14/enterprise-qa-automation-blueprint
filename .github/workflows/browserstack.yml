name: browserstack

# Real-device runs are billed per minute, so this does NOT run on every push.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'BrowserStack device (overrides default)'
        required: false
        default: ''
  schedule:
    # Weekly Monday 07:00 UTC — real-device sanity check
    - cron: '0 7 * * 1'

jobs:
  # `secrets.*` can't be tested in a job `if`, so this gate job checks once
  # and the real job reads the result via `needs`.
  gate:
    runs-on: ubuntu-latest
    outputs:
      bs_ready: ${{ steps.check.outputs.bs_ready }}
    steps:
      - id: check
        env:
          BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
          BS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -n "$BS_USER" ] && [ -n "$BS_KEY" ]; then
            echo "bs_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "bs_ready=false" >> "$GITHUB_OUTPUT"
          fi

  real-device:
    needs: gate
    # Skip silently when credentials aren't configured (e.g. forks).
    if: ${{ needs.gate.outputs.bs_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      # No `playwright install` — the browserstack project connects to a
      # remote device over CDP; no local browser binaries needed.

      - name: Set up BrowserStack environment
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Start BrowserStack Local tunnel
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start

      - name: Run mobile specs on real device
        working-directory: playwright-suite
        run: npm run test:browserstack
        env:
          CI: true
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_DEVICE: ${{ inputs.device || 'iPhone 15 Pro Max' }}   # ← CHANGE 'iPhone 15' → 'iPhone 15 Pro Max'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browserstack
          path: playwright-suite/playwright-report/
          retention-days: 14

      - name: Stop BrowserStack Local tunnel
        if: always()
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop