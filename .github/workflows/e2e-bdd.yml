name: E2E BDD

on:
  push:
    branches: [main]
    paths:
      - "playwright-suite/**"
      - ".github/workflows/e2e-bdd.yml"
  pull_request:
    paths:
      - "playwright-suite/**"
      - ".github/workflows/e2e-bdd.yml"
  workflow_dispatch:

jobs:
  bdd:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright-suite/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: playwright-suite
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate BDD tests
        working-directory: playwright-suite
        run: npx bddgen -c playwright.bdd.config.ts

      - name: Run BDD tests
        working-directory: playwright-suite
        run: npx playwright test -c playwright.bdd.config.ts
        env:
          CI: true

      - name: Upload BDD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-reports
          path: |
            playwright-suite/playwright-report
            playwright-suite/allure-results
          retention-days: 14
