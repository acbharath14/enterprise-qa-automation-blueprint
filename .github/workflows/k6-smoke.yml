name: k6-smoke

# k6 API smoke test (1 VU, ~30s) against the sample app.
# Runs on pushes/PRs touching the app or k6 scripts, plus manual trigger.
#
# Load and stress tests stay out of per-push CI (5-9 min each) — run them
# nightly or before releases: `k6 run k6/load-test.js`
#
# NOTE: paste this file as .github/workflows/k6-smoke.yml via the GitHub
# web UI (the GitHub App cannot write workflow files).

on:
  workflow_dispatch:
  push:
    paths:
      - 'playwright-suite/server.mjs'
      - 'playwright-suite/sample-app/**'
      - 'k6/**'
      - '.github/workflows/k6-smoke.yml'
  pull_request:
    paths:
      - 'playwright-suite/server.mjs'
      - 'playwright-suite/sample-app/**'
      - 'k6/**'
      - '.github/workflows/k6-smoke.yml'

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-suite/package-lock.json

      - name: Install dependencies
        working-directory: playwright-suite
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start sample app
        working-directory: playwright-suite
        run: |
          (node server.mjs > /tmp/app.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/api/products >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/api/products >/dev/null

      - name: k6 smoke test
        run: k6 run k6/smoke-test.js
