# API Health Check — copy to .github/workflows/health-check.yml
# (GitHub App cannot push workflow files; add via web UI)
#
# Runs the Postman collection hourly via Newman, emails the HTML report.
# Required secrets: RESEND_API_KEY, ALERT_TO, ALERT_FROM (optional)
name: API Health Check

"on":
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:      # manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Start sample app
        run: |
          cd playwright-suite
          node server.mjs &
          sleep 3
          curl -sf http://localhost:4173/api/metrics

      - name: Run Postman collection
        id: newman
        run: |
          mkdir -p reports
          newman run newman/health-check.postman_collection.json \
            -e newman/local.postman_environment.json \
            -r htmlextra,cli \
            --reporter-htmlextra-export reports/newman-report.html \
            || echo "failed=true" >> $GITHUB_OUTPUT

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman-report.html

      - name: Email report on failure
        if: steps.newman.outputs.failed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: |
          REPORT_B64=$(base64 -w0 reports/newman-report.html)
          FROM="${ALERT_FROM:-API Health Check <onboarding@resend.dev>}"
          curl -sf https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg to "$ALERT_TO" \
              --arg from "$FROM" \
              --arg subject "🚨 API Health Check FAILED — ${{ github.repository }}" \
              --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg b64 "$REPORT_B64" \
              '{from: $from, to: [$to], subject: $subject,
                html: ("<h2>API Health Check Failed</h2><p>Run: <a href="" + $run_url + "">view run</a></p><p>The hourly Postman/Newman health check found failing assertions. Full report attached.</p>"),
                attachments: [{filename: "newman-report.html", content: $b64}]}')" \
          && echo "Alert email sent" || echo "Alert email failed"
