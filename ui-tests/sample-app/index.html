<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise QA Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      main { max-width: 960px; margin: 0 auto; padding: 40px 24px; }
      .card { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-top: 24px; }
      button { background: #38bdf8; color: #082f49; border: 0; padding: 12px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; }
      .metric { display: inline-block; margin-right: 16px; margin-top: 12px; padding: 10px 14px; background: #1e293b; border-radius: 12px; }
      .status { margin-top: 16px; font-weight: 700; color: #86efac; }
    </style>
  </head>
  <body>
    <main>
      <h1>Enterprise QA Automation Blueprint</h1>
      <p>This sample application demonstrates a realistic smoke-test target with a visible journey, metrics, and an interactive action.</p>

      <section class="card" aria-label="quality summary">
        <h2>Release Snapshot</h2>
        <div class="metric" id="coverage">Coverage: 82%</div>
        <div class="metric" id="api">API Health: Green</div>
        <div class="metric" id="perf">P95 Latency: 640 ms</div>
        <div class="status" id="status">All critical checks are healthy.</div>
        <button id="refresh-button" type="button">Refresh health snapshot</button>
      </section>
    </main>

    <script>
      const status = document.getElementById('status');
      document.getElementById('refresh-button').addEventListener('click', () => {
        status.textContent = 'Snapshot refreshed successfully at ' + new Date().toLocaleTimeString();
      });
    </script>
  </body>
</html>
