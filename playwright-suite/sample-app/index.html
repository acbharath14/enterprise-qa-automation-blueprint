<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemoMart — Sample Store</title>
    <style>
      :root {
        --bg: #f6f7f9; --fg: #1a202c; --card: #ffffff;
        --border: #e2e8f0; --accent: #2563eb; --accent-fg: #ffffff;
        --ok: #15803d; --err: #b91c1c; --muted: #64748b;
      }
      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
      header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
      header .logo { font-size: 1.4em; font-weight: 800; color: var(--accent); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 0; }
      nav { display: flex; gap: 8px; margin-left: 8px; }
      nav button { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; color: var(--fg); }
      nav button[aria-current='page'] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      .badge { display: inline-block; min-width: 22px; text-align: center; background: var(--accent); color: var(--accent-fg); border-radius: 999px; font-size: 0.8em; padding: 1px 6px; margin-left: 6px; }
      nav button[aria-current='page'] .badge { background: var(--accent-fg); color: var(--accent); }
      .spacer { flex: 1; }
      main { max-width: 1080px; margin: 0 auto; padding: 24px; }
      .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 20px; }
      .toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1em; background: var(--card); color: var(--fg); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .card h3 { margin: 0; font-size: 1.05em; }
      .price { font-size: 1.25em; font-weight: 800; color: var(--accent); margin: 0; }
      .meta { color: var(--muted); font-size: 0.9em; margin: 0; }
      .card .actions { margin-top: auto; display: flex; gap: 8px; }
      button.primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
      button.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
      .detail h2 { margin-top: 0; }
      .stock-ok { color: var(--ok); font-weight: 700; }
      .stock-out { color: var(--err); font-weight: 700; }
      .qty-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
      .qty-row button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 1.2em; cursor: pointer; }
      .qty-row input { width: 64px; text-align: center; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 1em; }
      table.cart { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      table.cart th, table.cart td { padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: left; }
      .totals { text-align: right; margin-top: 16px; font-size: 1.1em; }
      .totals strong { font-size: 1.3em; }
      form.checkout { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 520px; }
      form.checkout label { display: block; margin-top: 12px; font-weight: 600; }
      form.checkout input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1em; }
      .error { color: var(--err); font-size: 0.9em; min-height: 1.2em; margin: 2px 0 0; }
      .error-summary { background: #fef2f2; border: 1px solid #fecaca; color: var(--err); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
      .confirm { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 640px; }
      .confirm .order-id { font-size: 1.2em; font-weight: 800; color: var(--ok); }
      #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a202c; color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; z-index: 100; }
      #toast[hidden] { display: none; }
      .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 420px; }
      .login-card input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1em; }
      .login-card label { display: block; margin-top: 12px; font-weight: 600; }
      .hint { color: var(--muted); font-size: 0.9em; margin-top: 16px; }
    </style>
  </head>
  <body>
    <header data-testid="site-header">
      <button class="logo" data-testid="store-logo">DemoMart</button>
      <nav aria-label="Store">
        <button data-testid="nav-catalog" aria-current="page">Catalog</button>
        <button data-testid="nav-cart">Cart <span class="badge" data-testid="cart-badge">0</span></button>
      </nav>
      <span class="spacer"></span>
      <span data-testid="user-label" hidden></span>
      <button class="secondary" data-testid="login-button">Log in</button>
      <button class="secondary" data-testid="logout-button" hidden>Log out</button>
    </header>

    <main>
      <!-- Catalog -->
      <section data-testid="catalog-view" data-view="catalog">
        <h1>Catalog</h1>
        <div class="toolbar">
          <input data-testid="search-input" type="search" placeholder="Search products…" aria-label="Search products" />
          <select data-testid="category-filter" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
          <select data-testid="sort-select" aria-label="Sort products">
            <option value="">Sort: featured</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </div>
        <div class="grid" data-testid="product-grid"></div>
        <p data-testid="no-results" hidden>No products match your filters.</p>
      </section>

      <!-- Product detail -->
      <section data-testid="product-detail-view" data-view="detail" hidden>
        <button class="secondary" data-testid="back-to-catalog">← Back to catalog</button>
        <div class="detail" data-testid="product-detail" style="margin-top: 16px;">
          <div>
            <h2 data-testid="detail-name"></h2>
            <p class="price" data-testid="detail-price"></p>
            <p class="meta" data-testid="detail-meta"></p>
            <p data-testid="detail-description"></p>
            <p data-testid="detail-stock"></p>
          </div>
          <div>
            <div class="qty-row">
              <button data-testid="detail-qty-dec" aria-label="Decrease quantity">−</button>
              <input data-testid="detail-qty" type="number" min="1" value="1" aria-label="Quantity" />
              <button data-testid="detail-qty-inc" aria-label="Increase quantity">+</button>
            </div>
            <button class="primary" data-testid="detail-add-to-cart">Add to Cart</button>
          </div>
        </div>
      </section>

      <!-- Cart -->
      <section data-testid="cart-view" data-view="cart" hidden>
        <h1>Your Cart</h1>
        <p data-testid="cart-empty" hidden>Your cart is empty.</p>
        <div data-testid="cart-items">
          <table class="cart">
            <thead><tr><th>Product</th><th>Unit price</th><th>Quantity</th><th>Line total</th><th></th></tr></thead>
            <tbody data-testid="cart-lines"></tbody>
          </table>
          <div class="totals">
            <p>Subtotal: <span data-testid="cart-subtotal"></span></p>
            <p>Total: <strong data-testid="cart-total"></strong></p>
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
            <button class="secondary" data-testid="continue-shopping-button">Continue shopping</button>
            <button class="secondary" data-testid="clear-cart-button">Clear cart</button>
            <button class="primary" data-testid="checkout-button">Checkout</button>
          </div>
        </div>
      </section>

      <!-- Checkout -->
      <section data-testid="checkout-view" data-view="checkout" hidden>
        <h1>Checkout</h1>
        <p>Order subtotal: <strong data-testid="checkout-subtotal"></strong></p>
        <form class="checkout" data-testid="checkout-form" novalidate>
          <div class="error-summary" data-testid="checkout-errors" hidden></div>
          <label>Full name
            <input data-testid="checkout-name" name="name" autocomplete="name" />
          </label>
          <p class="error" data-testid="checkout-error-name"></p>
          <label>Email
            <input data-testid="checkout-email" name="email" type="email" autocomplete="email" />
          </label>
          <p class="error" data-testid="checkout-error-email"></p>
          <label>Shipping address
            <input data-testid="checkout-address" name="address" autocomplete="street-address" />
          </label>
          <p class="error" data-testid="checkout-error-address"></p>
          <label>Card number
            <input data-testid="checkout-card-number" name="cardNumber" inputmode="numeric" placeholder="4111 1111 1111 1111" />
          </label>
          <p class="error" data-testid="checkout-error-card"></p>
          <label>Expiry (MM/YY)
            <input data-testid="checkout-card-expiry" name="expiry" placeholder="12/30" />
          </label>
          <label>CVC
            <input data-testid="checkout-card-cvc" name="cvc" inputmode="numeric" placeholder="123" />
          </label>
          <div style="margin-top: 16px; display: flex; gap: 8px;">
            <button type="submit" class="primary" data-testid="place-order-button">Place order</button>
            <button type="button" class="secondary" data-testid="back-to-cart-button">Back to cart</button>
          </div>
        </form>
      </section>

      <!-- Order confirmation -->
      <section data-testid="order-confirmation-view" data-view="confirmation" hidden>
        <div class="confirm" data-testid="order-confirmation">
          <h1>Thank you for your order!</h1>
          <p>Order ID: <span class="order-id" data-testid="order-id"></span></p>
          <p>Total charged: <strong data-testid="order-total"></strong></p>
          <h2>Items</h2>
          <ul data-testid="order-items"></ul>
          <button class="primary" data-testid="confirmation-continue-button">Continue shopping</button>
        </div>
      </section>

      <!-- Login -->
      <section data-testid="login-view" data-view="login" hidden>
        <div class="login-card">
          <h1>Log in</h1>
          <p class="error" data-testid="login-error"></p>
          <label>Username
            <input data-testid="login-username" name="username" autocomplete="username" />
          </label>
          <label>Password
            <input data-testid="login-password" name="password" type="password" autocomplete="current-password" />
          </label>
          <div style="margin-top: 16px;">
            <button class="primary" data-testid="login-submit">Log in</button>
          </div>
          <p class="hint">Demo credentials: <code>admin</code> / <code>secret</code></p>
        </div>
      </section>
    </main>

    <div id="toast" data-testid="toast" role="status" aria-live="polite" hidden></div>

    <script>
      'use strict';
      const $ = (sel, root) => (root || document).querySelector(sel);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const money = (n) => '$' + Number(n).toFixed(2);

      const filters = { q: '', category: '', sort: '' };
      let detailProduct = null;
      let toastTimer = null;

      function showToast(msg) {
        const t = $('[data-testid="toast"]');
        t.textContent = msg;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.hidden = true; }, 2500);
      }

      function show(view) {
        document.querySelectorAll('[data-view]').forEach((s) => { s.hidden = s.dataset.view !== view; });
        $('[data-testid="nav-catalog"]').setAttribute('aria-current', view === 'catalog' ? 'page' : 'false');
        $('[data-testid="nav-cart"]').setAttribute('aria-current', view === 'cart' ? 'page' : 'false');
        window.scrollTo(0, 0);
      }

      async function req(method, path, data) {
        const res = await fetch(path, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: data === undefined ? undefined : JSON.stringify(data),
        });
        let body = null;
        try { body = await res.json(); } catch (e) { /* empty body (204) */ }
        return { status: res.status, body };
      }

      async function refreshBadge() {
        const { body } = await req('GET', '/api/cart');
        const count = (body.items || []).reduce((n, i) => n + i.qty, 0);
        $('[data-testid="cart-badge"]').textContent = String(count);
      }

      function productCard(p) {
        return `<article class="card" data-testid="product-card-${p.id}">
          <h3 data-testid="product-name-${p.id}">${esc(p.name)}</h3>
          <p class="price" data-testid="product-price-${p.id}">${money(p.price)}</p>
          <p class="meta"><span data-testid="product-category-${p.id}">${esc(p.category)}</span> · ★ <span data-testid="product-rating-${p.id}">${p.rating}</span></p>
          <div class="actions">
            <button class="secondary" data-testid="view-product-${p.id}" data-view-product="${p.id}">Details</button>
            <button class="primary" data-testid="add-to-cart-${p.id}" data-add-product="${p.id}">Add to Cart</button>
          </div>
        </article>`;
      }

      async function loadCatalog() {
        const params = new URLSearchParams();
        if (filters.q) params.set('q', filters.q);
        if (filters.category) params.set('category', filters.category);
        if (filters.sort) params.set('sort', filters.sort);
        const { body } = await req('GET', '/api/products' + (params.toString() ? '?' + params : ''));
        const grid = $('[data-testid="product-grid"]');
        grid.innerHTML = body.map(productCard).join('');
        $('[data-testid="no-results"]').hidden = body.length > 0;
        const cats = [...new Set(body.map((p) => p.category))].sort();
        const sel = $('[data-testid="category-filter"]');
        const current = sel.value;
        sel.innerHTML = '<option value="">All categories</option>' + cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
        if (cats.includes(current)) sel.value = current;
      }

      async function addToCart(productId, qty) {
        const { status, body } = await req('POST', '/api/cart/items', { productId, qty });
        if (status === 200) {
          const p = body.items.find((i) => i.productId === productId);
          showToast(`Added ${p ? p.name : 'item'} to cart`);
          await refreshBadge();
        } else {
          showToast(body && body.error ? body.error : 'Could not add to cart');
        }
        return status;
      }

      async function openDetail(productId) {
        const { status, body } = await req('GET', '/api/products/' + encodeURIComponent(productId));
        if (status !== 200) return;
        detailProduct = body;
        $('[data-testid="detail-name"]').textContent = body.name;
        $('[data-testid="detail-price"]').textContent = money(body.price);
        $('[data-testid="detail-meta"]').textContent = `${body.category} · ★ ${body.rating}`;
        $('[data-testid="detail-description"]').textContent = body.description || 'No description.';
        const stockEl = $('[data-testid="detail-stock"]');
        if (body.stock > 0) {
          stockEl.textContent = `In stock (${body.stock} available)`;
          stockEl.className = 'stock-ok';
        } else {
          stockEl.textContent = 'Out of stock';
          stockEl.className = 'stock-out';
        }
        $('[data-testid="detail-qty"]').value = '1';
        $('[data-testid="detail-add-to-cart"]').disabled = body.stock === 0;
        show('detail');
      }

      async function renderCart() {
        const { body } = await req('GET', '/api/cart');
        const empty = body.items.length === 0;
        $('[data-testid="cart-empty"]').hidden = !empty;
        $('[data-testid="cart-items"]').style.display = empty ? 'none' : '';
        const tbody = $('[data-testid="cart-lines"]');
        tbody.innerHTML = body.items.map((i) => `<tr data-testid="cart-item-${i.productId}">
          <td data-testid="cart-item-name-${i.productId}">${esc(i.name)}</td>
          <td>${money(i.price)}</td>
          <td>
            <button class="secondary" data-testid="cart-dec-${i.productId}" data-cart-dec="${i.productId}" aria-label="Decrease quantity">−</button>
            <span data-testid="cart-qty-${i.productId}" style="margin: 0 8px;">${i.qty}</span>
            <button class="secondary" data-testid="cart-inc-${i.productId}" data-cart-inc="${i.productId}" aria-label="Increase quantity">+</button>
          </td>
          <td data-testid="cart-line-total-${i.productId}">${money(i.price * i.qty)}</td>
          <td><button class="secondary" data-testid="cart-remove-${i.productId}" data-cart-remove="${i.productId}">Remove</button></td>
        </tr>`).join('');
        $('[data-testid="cart-subtotal"]').textContent = money(body.subtotal);
        $('[data-testid="cart-total"]').textContent = money(body.subtotal);
        await refreshBadge();
      }

      function setCheckoutError(field, msg) {
        $('[data-testid="checkout-error-' + field + '"]').textContent = msg || '';
      }

      async function openCheckout() {
        const { body } = await req('GET', '/api/cart');
        if (body.items.length === 0) { showToast('Your cart is empty'); return; }
        $('[data-testid="checkout-subtotal"]').textContent = money(body.subtotal);
        show('checkout');
      }

      async function placeOrder(e) {
        e.preventDefault();
        ['name', 'email', 'address', 'card'].forEach((f) => setCheckoutError(f, ''));
        const box = $('[data-testid="checkout-errors"]');
        box.hidden = true; box.innerHTML = '';
        const v = (id) => $('[data-testid="' + id + '"]').value.trim();
        const errors = {};
        if (!v('checkout-name')) errors.name = 'Full name is required.';
        if (!v('checkout-email') || !v('checkout-email').includes('@')) errors.email = 'Enter a valid email address.';
        if (!v('checkout-address')) errors.address = 'Shipping address is required.';
        const digits = v('checkout-card-number').replace(/\D/g, '');
        if (digits.length < 12) errors.card = 'Enter a valid card number.';
        const expiry = v('checkout-card-expiry');
        if (!/^\d{2}\/\d{2}$/.test(expiry)) errors.card = errors.card || 'Expiry must be MM/YY.';
        if (!/^\d{3,4}$/.test(v('checkout-card-cvc'))) errors.card = errors.card || 'CVC must be 3–4 digits.';
        Object.keys(errors).forEach((f) => setCheckoutError(f, errors[f]));
        if (Object.keys(errors).length > 0) {
          box.innerHTML = '<ul>' + Object.values(errors).map((m) => `<li>${esc(m)}</li>`).join('') + '</ul>';
          box.hidden = false;
          return;
        }
        const { status, body } = await req('POST', '/api/orders', {
          name: v('checkout-name'),
          email: v('checkout-email'),
          address: v('checkout-address'),
          payment: { cardLast4: digits.slice(-4) },
        });
        if (status === 201) {
          $('[data-testid="order-id"]').textContent = body.id;
          $('[data-testid="order-total"]').textContent = money(body.total);
          $('[data-testid="order-items"]').innerHTML = body.items
            .map((i) => `<li>${esc(i.name)} × ${i.qty} — ${money(i.price * i.qty)}</li>`).join('');
          show('confirmation');
          await refreshBadge();
        } else {
          const msg = (body && body.error) || 'Order failed.';
          box.innerHTML = `<ul><li>${esc(msg)}</li></ul>`;
          box.hidden = false;
        }
      }

      function setAuth(token, username) {
        if (token) localStorage.setItem('demomart-token', token);
        else localStorage.removeItem('demomart-token');
        $('[data-testid="login-button"]').hidden = !!token;
        $('[data-testid="logout-button"]').hidden = !token;
        const label = $('[data-testid="user-label"]');
        label.hidden = !token;
        if (token) label.textContent = `Signed in as ${username || 'admin'}`;
      }

      async function doLogin(e) {
        e.preventDefault();
        const username = $('[data-testid="login-username"]').value.trim();
        const password = $('[data-testid="login-password"]').value;
        const { status, body } = await req('POST', '/api/login', { username, password });
        if (status === 200) {
          $('[data-testid="login-error"]').textContent = '';
          setAuth(body.token, username);
          showToast(`Welcome, ${username}!`);
          show('catalog');
        } else {
          $('[data-testid="login-error"]').textContent = (body && body.error) || 'Login failed.';
        }
      }

      function bind() {
        $('[data-testid="store-logo"]').addEventListener('click', () => { loadCatalog(); show('catalog'); });
        $('[data-testid="nav-catalog"]').addEventListener('click', () => { loadCatalog(); show('catalog'); });
        $('[data-testid="nav-cart"]').addEventListener('click', () => { renderCart(); show('cart'); });
        $('[data-testid="login-button"]').addEventListener('click', () => show('login'));
        $('[data-testid="logout-button"]').addEventListener('click', () => { setAuth(null); showToast('Signed out.'); });
        $('[data-testid="search-input"]').addEventListener('input', (e) => { filters.q = e.target.value; loadCatalog(); });
        $('[data-testid="category-filter"]').addEventListener('change', (e) => { filters.category = e.target.value; loadCatalog(); });
        $('[data-testid="sort-select"]').addEventListener('change', (e) => { filters.sort = e.target.value; loadCatalog(); });

        document.addEventListener('click', async (e) => {
          const t = e.target;
          const add = t.closest('[data-add-product]');
          if (add) { await addToCart(add.dataset.addProduct, 1); return; }
          const view = t.closest('[data-view-product]');
          if (view) { await openDetail(view.dataset.viewProduct); return; }
          const inc = t.closest('[data-cart-inc]');
          if (inc) {
            const pid = inc.dataset.cartInc;
            const line = (await req('GET', '/api/cart')).body.items.find((i) => i.productId === pid);
            await req('PATCH', '/api/cart/items/' + encodeURIComponent(pid), { qty: line.qty + 1 });
            await renderCart(); return;
          }
          const dec = t.closest('[data-cart-dec]');
          if (dec) {
            const pid = dec.dataset.cartDec;
            const line = (await req('GET', '/api/cart')).body.items.find((i) => i.productId === pid);
            await req('PATCH', '/api/cart/items/' + encodeURIComponent(pid), { qty: line.qty - 1 });
            await renderCart(); return;
          }
          const rem = t.closest('[data-cart-remove]');
          if (rem) { await req('DELETE', '/api/cart/items/' + encodeURIComponent(rem.dataset.cartRemove)); await renderCart(); }
        });

        $('[data-testid="back-to-catalog"]').addEventListener('click', () => show('catalog'));
        $('[data-testid="detail-qty-inc"]').addEventListener('click', () => { const q = $('[data-testid="detail-qty"]'); q.value = String(Number(q.value || 1) + 1); });
        $('[data-testid="detail-qty-dec"]').addEventListener('click', () => { const q = $('[data-testid="detail-qty"]'); q.value = String(Math.max(1, Number(q.value || 1) - 1)); });
        $('[data-testid="detail-add-to-cart"]').addEventListener('click', async () => {
          if (!detailProduct) return;
          await addToCart(detailProduct.id, Math.max(1, Number($('[data-testid="detail-qty"]').value || 1)));
        });

        $('[data-testid="continue-shopping-button"]').addEventListener('click', () => { loadCatalog(); show('catalog'); });
        $('[data-testid="clear-cart-button"]').addEventListener('click', async () => { await req('DELETE', '/api/cart'); await renderCart(); });
        $('[data-testid="checkout-button"]').addEventListener('click', openCheckout);
        $('[data-testid="checkout-form"]').addEventListener('submit', placeOrder);
        $('[data-testid="back-to-cart-button"]').addEventListener('click', () => { renderCart(); show('cart'); });
        $('[data-testid="confirmation-continue-button"]').addEventListener('click', () => { loadCatalog(); show('catalog'); });
        $('[data-testid="login-submit"]').addEventListener('click', doLogin);
        $('[data-testid="login-password"]').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(e); });
      }

      bind();
      setAuth(localStorage.getItem('demomart-token'));
      loadCatalog();
      refreshBadge();
      show('catalog');
    </script>
  </body>
</html>
